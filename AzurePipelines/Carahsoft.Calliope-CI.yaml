trigger:
  branches:
    include:
    - main
  paths:
    include:
    - Carahsoft.Calliope
    - Carahsoft.Calliope.Elm
variables:
  BaseVersion: 0.3
  BuildPlatform: AnyCPU
  ProjectName: Carahsoft.Calliope
  Solution: Carahsoft.Calliope.sln
name: $(BaseVersion)$(Rev:.r)
jobs:
- job: Job_1
  displayName: NuGet
  pool:
    vmimage: 'ubuntu-latest'
  variables:
    BuildConfiguration: Release
  steps:
  - checkout: self
  - task: UseDotNet@2
    displayName: 'Use .NET 10.0.x'
    inputs:
      version: 10.0.x
  - task: DotNetCoreCLI@2
    displayName: dotnet build
    inputs:
      command: build
      projects: '**/$(ProjectName).sln'
      versioningScheme: byBuildNumber
      arguments: -c $(BuildConfiguration)

  - task: DotNetCoreCLI@2
    displayName: dotnet test
    inputs:
      command: test
      projects: |
        **/$(ProjectName).Tests.csproj
        **/$(ProjectName).Elm.Tests.fsproj
      arguments: -c $(BuildConfiguration) --no-build

  - task: DotNetCoreCLI@2
    displayName: dotnet pack
    inputs:
      command: pack
      projects: '**/$(ProjectName).csproj'
      searchPatternPack: '**/$(ProjectName).csproj'
      versioningScheme: byBuildNumber
      arguments: --no-restore --no-build

  # The Elm package has its own version line, so it's packed with the VersionPrefix in its .fsproj.
  # It depends on Carahsoft.Calliope >= the VersionPrefix in Carahsoft.Calliope.csproj.
  - task: DotNetCoreCLI@2
    displayName: dotnet pack Elm
    inputs:
      command: pack
      packagesToPack: '**/$(ProjectName).Elm.fsproj'
      versioningScheme: off
      nobuild: true
  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: '$(Build.ArtifactStagingDirectory)'
      ArtifactName: 'drop'
      publishLocation: 'Container'